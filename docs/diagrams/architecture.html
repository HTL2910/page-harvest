<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Harvest · Component Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Page Harvest MV3 Extension</p>
    <h1>Component architecture and isolated tab runtime</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="page-harvest-architecture-title page-harvest-architecture-desc">

        <desc id="page-harvest-architecture-desc">Architecture diagram showing toolbar action clicks invoking worker.js to inject panel.js, extractor.js, and xlsx.js into the active tab isolated world for DOM extraction and local XLSX Blob download, or opening error.html on injection failure.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <!-- Clean paper ground -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="228" y="164" width="184" height="268" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="256" y="168" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="177" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">EXTENSION CONTEXT</text>

        <rect x="500" y="40" width="224" height="392" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="520" y="44" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="612" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">ACTIVE TAB · ISOLATED WORLD</text>

        <!-- Arrows first (behind boxes) -->
        <!-- 1. Toolbar Action -> worker.js -->
        <line x1="164" y1="240" x2="240" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 2. worker.js -> error.html / error.js (on error) -->
        <line x1="320" y1="276" x2="320" y2="344" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- 3. worker.js -> panel.js (chrome.scripting.executeScript) -->
        <line x1="400" y1="240" x2="512" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 4. panel.js -> extractor.js -->

        <line x1="712" y1="104" x2="820" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <line x1="712" y1="252" x2="820" y2="252" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 9. xlsx.js -> panel.js (dashed return, right vertical lane) -->
        <line x1="644" y1="344" x2="644" y2="276" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <rect x="240" y="344" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="344" width="160" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="248" y="352" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="262" y="361" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ERR</text>
        <text x="320" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">error.html / .js</text>
        <text x="320" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">#detail · demo.css</text>
